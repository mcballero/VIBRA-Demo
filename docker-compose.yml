version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: thirdspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: thirdspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: thirdspace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: thirdspace-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/thirdspace?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-change-me
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
      MOBILE_APP_SCHEME: thirdspaceai://
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: thirdspace-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:

